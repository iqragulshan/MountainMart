<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Mart - Manager Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/Mountain Mart Fresh Peaks Logo.png') }}">
    <script src="{{ url_for('static', filename='js/manager-login.js') }}" defer></script>
</head>

<body class="manager-login-page">

    <div class="manager-login-container">

        <a href="{{ url_for('customer.customer_home') }}" class="manager-login-brand">
            <img src="{{ url_for('static', filename='images/Mountain Mart Fresh Peaks Logo.png') }}" alt="Mountain Mart - Your Local General Store" class="manager-login-logo">
        </a>

        <h2>Manager Login</h2>

        <form method="POST" action="{{ url_for('auth.manager_login') }}">

            <label>Email Address</label>
            <input type="email" id="manager-email" name="email" placeholder="Enter your email" autocomplete="username" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>

            <button type="submit">Login</button>

        </form>

        {% with messages = get_flashed_messages(with_categories=true) %} {% if messages %} {% for category, message in messages %}
        <div class="auth-message {{ category }}">
            {{ message }}
        </div>
        {% endfor %} {% endif %} {% endwith %}

    </div>

</body>

</html>
